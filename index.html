<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的人格城市测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#f7f8fa;color:#222;padding:24px;max-width:800px;margin:0 auto;}
h1{text-align:center;margin-bottom:30px;font-size:24px;font-weight:600;}
.question{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000008;}
.q-title{font-weight:500;margin-bottom:14px;line-height:1.5;}
.opt{display:block;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:0.2s;}
.opt:hover{border-color:#3b82f6;background:#f0f7ff;}
.opt.selected{background:#3b82f6;color:#fff;border-color:#3b82f6;}
#submit{width:100%;padding:14px;background:#222;color:#fff;border:none;border-radius:10px;font-size:16px;margin-top:20px;cursor:pointer;}
#reset{width:100%;padding:14px;background:#666;color:#fff;border:none;border-radius:10px;font-size:16px;margin-top:12px;cursor:pointer;display:none;}
#result{margin-top:24px;padding:24px;background:#fff;border-radius:12px;text-align:center;display:none;}
.city-name{font-size:32px;font-weight:bold;margin:10px 0;color:#2563eb;}
.city-desc{line-height:1.7;margin-top:12px;color:#444;}
</style>
</head>

  <div class="city-name" id="cityName"></div>

d:'固守熟悉的，不爱折腾',

{d:3,q:'意外拿到一笔奖金，你优先？',
a:'储蓄投资，提升现实物质',

a:'实用性、性价比、现实价值',
b:'实用优先，兼顾一点感受',
c:'物质实用与精神体验对半',
d:'是否带来美好体验最重要',
sa:2,sb:1,sc:-1,sd:-2},

{d:3,q:'选择一份工作，优先看重？',
a:'薪资成长、现实发展前景',
b:'看重发展同时顾及感受',
c:'希望工作拥有部分意义感',
d:'热爱、精神感受大于现实收益',
sa:2,sb:1,sc:-1,sd:-2},

{d:3,q:'业余购物，你的购物车更多是？',
a:'提升生活的实用器物',
b:'以生活用品实用物件为主',
c:'既有实用，也有爱玩爱好之物',
d:'爱好、体验、精神享受类物品',
sa:2,sb:1,sc:-1,sd:-2},

{d:3,q:'人生取舍时你认为？',
a:'先把现实事业基础打好',
b:'努力奋斗，适度享受生活',
c:'奋斗与及时享乐互相平衡',
d:'人生重在体验，活在当下',
sa:2,sb:1,sc:-1,sd:-2},

{d:3,q:'周末难得空闲，你的选择？',
a:'利用时间提升自我现实层面',
b:'处理琐事之余适度放松',
c:'兼顾事务和个人愉悦体验',
d:'完全沉浸在喜欢的体验之中',
sa:2,sb:1,sc:-1,sd:-2}
];

const CITY_MAP = {
  "0000":{name:"深圳",desc:"疾风、烟火、闯荡、罗盘。永远向前奔跑，相信努力可以改写生活，热烈务实，敢闯敢拼。"},
  "0001":{name:"上海",desc:"疾风、烟火、闯荡、诗歌。节奏飞快，长袖善舞，热爱新鲜，也愿意为浪漫与体验买单。"},
  "0010":{name:"广州",desc:"疾风、烟火、守成、罗盘。热闹人间烟火，踏实过日子，稳健务实，不喜欢盲目冒险。"},
  "0011":{name:"成都",desc:"疾风、烟火、守成、诗歌。热闹松弛，懂社交，安稳度日，人生重在舒服自在。"},

  "0101":{name:"南京",desc:"疾风、独酌、闯荡、诗歌。节奏在线，喜静向内，愿意探索，偏爱精神丰盈。"},
  "0110":{name:"重庆",desc:"疾风、独酌、守成、罗盘。干脆利落，不爱喧闹，求稳，看重实实在在的收获。"},
  "0111":{name:"昆明",desc:"疾风、独酌、守成、诗歌。行动干脆，享受独处，安稳慢活，忠于内心感受。"},
  "1000":{name:"北京",desc:"慢煮、烟火、闯荡、罗盘。从容节奏，擅长社交，不甘平庸，看重长远现实价值。"},
  "1001":{name:"武汉",desc:"慢煮、烟火、闯荡、诗歌。松弛有度，乐于热闹，愿意突破，为热爱而活。"},
  "1010":{name:"西安",desc:"慢煮、烟火、守成、罗盘。烟火绵长，不喜变动，安稳沉淀，看重实在所得。"},
  "1011":{name:"大理",desc:"慢煮、烟火、守成、诗歌。温柔松弛，喜欢人间烟火，拒绝内卷，感受优先。"},
  "1100":{name:"青岛",desc:"慢煮、独酌、闯荡、罗盘。从容安静，不喜喧嚣，敢于尝试，理性务实。"},
  "1101":{name:"厦门",desc:"慢煮、独酌、闯荡、诗歌。安静松弛，向内探索，愿意拥抱变化，浪漫优先。"},
  "1110":{name:"丽江",desc:"慢煮、独酌、守成、罗盘。岁月缓慢，享受独处，不喜折腾，安稳踏实。"},
  "1111":{name:"拉萨",desc:"慢煮、独酌、守成、诗歌。极致松弛，偏爱独处，拒绝风险，人生是一场感受的旅途。"}
};

const answers = Array(QUESTIONS.length).fill(null);
const wrap = document.getElementById("wrap");
const resetBtn = document.getElementById("reset");

//渲染题目【和你上一版渲染代码完全一致】
QUESTIONS.forEach((q, idx)=>{
  const box = document.createElement("div");
  box.className = "question";
  box.innerHTML = `<div class="q-title">${idx+1}. ${q.q}</div>
    <label class="opt" data-idx="${idx}" data-ans="A">A. ${q.a}</label>
    <label class="opt" data-idx="${idx}" data-ans="B">B. ${q.b}</label>
    <label class="opt" data-idx="${idx}" data-ans="C">C. ${q.c}</label>
    <label class="opt" data-idx="${idx}" data-ans="D">D. ${q.d}</label>`;
  wrap.appendChild(box);
});

//选项点击选中逻辑
document.querySelectorAll(".opt").forEach(el=>{
  el.onclick = ()=>{
    const i = el.dataset.idx;
    const ans = el.dataset.ans;
    answers[i] = ans;
    el.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
    el.classList.add("selected");
  }
})

//计算维度分数、编码
function computeCode(){
  const dimScore = [0,0,0,0];
  for(let i=0;i<QUESTIONS.length;i++){
    const q = QUESTIONS[i];
    const ans = answers[i];
    let scoreAdd = 0;
    if(ans === "A") scoreAdd = q.sa;
    else if(ans === "B") scoreAdd = q.sb;
    else if(ans === "C") scoreAdd = q.sc;
    else if(ans === "D") scoreAdd = q.sd;
    const dimIndex = q.d;
    if(dimIndex >=0 && dimIndex <=3){
      dimScore[dimIndex] += scoreAdd;
    }
  }
  console.log("各维度分数：", dimScore);
  let code = "";
  for(let d=0;d<4;d++){
    if(dimScore[d] > 0){
      code += "0";
    }else{
      code += "1";
    }
  }
  console.log("输出4位编码：", code);
  return code;
}

//提交按钮
document.getElementById("submit").onclick = ()=>{
  if(answers.includes(null)){
    alert("请完成所有题目！");
    return;
  }
  const code = computeCode();
  const city = CITY_MAP[code];
  document.getElementById("result").style.display = "block";
  resetBtn.style.display = "block";
  document.getElementById("cityName").innerText = city.name;
  document.getElementById("cityDesc").innerText = city.desc;
}

//重置按钮
resetBtn.onclick = ()=>{
  answers.fill(null);
  document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
  document.getElementById("result").style.display = "none";
  resetBtn.style.display = "none";
}
</script>

</html>
