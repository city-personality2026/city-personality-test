<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>城市人格测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f7f8fa;color:#222;padding:20px;max-width:700px;margin:0 auto}
.box{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 16px #00000012}
.title{font-size:24px;font-weight:bold;margin-bottom:12px;text-align:center}
.desc{color:#666;text-align:center;margin-bottom:20px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:16px}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#3ecf8e;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{background:#aaa;cursor:not-allowed}
.msg{margin-top:16px;text-align:center;font-size:15px}
.ok{color:#23a96c}
.err{color:#e5484d}
</style>
</head>
<body>
<div class="box">
  <div class="title">城市人格测试</div>
  <div class="desc">输入访问密码开始测试（每个密码最多可测试3次）</div>
  <input id="pwdInput" placeholder="请输入密码" />
  <button id="startBtn">开始测试</button>
  <div id="msg" class="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://wxxcnsgxggeyaqgmqkly.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_UHx7NMnBM1U82bNyq9g8cw_jpoO2-Mq";

const pwdInput = document.getElementById("pwdInput");
const startBtn = document.getElementById("startBtn");
const msgDom = document.getElementById("msg");

startBtn.onclick = async ()=>{
  const pwd = pwdInput.value.trim();
  if(!pwd){
    msgDom.className = "msg err";
    msgDom.innerText = "请输入密码";
    return;
  }
  startBtn.disabled = true;
  msgDom.innerText = "校验中...";
  msgDom.className = "msg";

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/consume_test_password`,{
      method:"POST",
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Content-Type":"application/json"
      },
      body: JSON.stringify({ input_pwd: pwd })
    });
    const data = await res.json();
    if(data.ok){
      msgDom.className = "msg ok";
      msgDom.innerText = `校验成功！剩余次数：${data.left}，即将进入测试...`;
      setTimeout(()=>{
        alert("这里接入你的人格测试题目页面");
      },1200);
    }else if(data.error === "invalid"){
      msgDom.className = "msg err";
      msgDom.innerText = "密码错误";
    }else if(data.error === "exhausted"){
      msgDom.className = "msg err";
      msgDom.innerText = "该密码测试次数已用完";
    }
  }catch(e){
    msgDom.className = "msg err";
    msgDom.innerText = "网络请求失败，请稍后重试";
    console.error(e);
  }
  startBtn.disabled = false;
}
</script>
</body>
</html>
