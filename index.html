/* ============ 密码校验：调用Supabase REST API ============ */
let currentPwd=null;
let isRequesting=false;
async function apiStart(pwd){
  try{
    const q = encodeURIComponent(pwd);
    const selUrl = `${SUPABASE_URL}/rest/v1/test_passwords?pwd=eq.${q}&select=pwd,max_uses,used`;
    const selRes = await fetch(selUrl,{
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    const rows = await selRes.json();
    if(!Array.isArray(rows) || rows.length===0){
      return {ok:false,error:"invalid"};
    }
    const row = rows[0];
    if(row.used >= row.max_uses){
      return {ok:false,error:"exhausted"};
    }
    const newUsed = row.used + 1;
    const patchUrl = `${SUPABASE_URL}/rest/v1/test_passwords?pwd=eq.${q}`;
    await fetch(patchUrl,{
      method:"PATCH",
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({used:newUsed})
    });
    const left = row.max_uses - newUsed;
    return {ok:true, left};
  }catch(e){
    console.error("网络异常捕获：",e);
    return {ok:false,error:"network"};
  }
}

$('pwdHint').innerHTML=`每个密码可测试 ${MAX_USES} 次<br><small>⚠️本页面需要网页服务器部署，本地直接打开会网络报错</small>`;

$('btnGate').onclick=async ()=>{
  if(isRequesting) return;
  const pwd=$('pwd').value.trim();
  if(!pwd){
    $('pwdErr').textContent='请输入测试密码';
    toast('请输入测试密码');
    return;
  }
  isRequesting=true;
  $('btnGate').disabled=true;
  $('btnGate').textContent='验证中…';
  $('pwdErr').textContent='';
  const ret=await apiStart(pwd);
  isRequesting=false;
  $('btnGate').disabled=false;
  $('btnGate').textContent='开始测试';
  if(!ret.ok){
    if(ret.error==='invalid'){
      $('pwdErr').textContent='密码不正确，请重试';
      toast('密码不正确，请重试');
    }else if(ret.error==='exhausted'){
      $('pwdErr').textContent='该密码的测试机会已用完';
      toast('该密码的测试机会已用完');
      $('btnGate').disabled=true;
    }else if(ret.error==='network'){
      $('pwdErr').textContent='网络请求失败！不能本地双击打开，需要网页服务器部署';
      toast('网络请求失败！不能本地双击打开，需要网页服务器部署');
    }
    return;
  }
  currentPwd=pwd;
  $('pwdHint').innerHTML=`验证通过，本密码剩余 ${ret.left} 次测试机会`;
  toast("密码校验成功");
  resetTestState();
  renderQ();
  show('s-quiz');
};

});

/* ============ 四选项答题逻辑 增加picking防连点丢失答案 ============ */
let cur=0, answers=Array(QUESTIONS.length).fill(null);
let picking = false;

function renderQ(){
  console.log('renderQ运行，当前题号：', cur);
  try{
    const q=QUESTIONS[cur];
    $('qNum').textContent=`${cur+1} / ${QUESTIONS.length}`;
    const dim = DIMS[q.d] ?? DIMS[0];
    $('dimName').textContent=dim.name;
    $('barFill').style.width=(cur/QUESTIONS.length*100)+'%';
    $('qText').textContent=q.q;
    $('optA').textContent=q.a;
    $('optB').textContent=q.b;
    $('optC').textContent=q.c;
    $('optD').textContent=q.d;
    $('optA').classList.toggle('sel',answers[cur]==='A');
    $('optB').classList.toggle('sel',answers[cur]==='B');
    $('optC').classList.toggle('sel',answers[cur]==='C');
    $('optD').classList.toggle('sel',answers[cur]==='D');
    $('btnPrev').style.visibility=cur===0?'hidden':'visible';
  }catch(e){
    console.error('renderQ报错：',e);
    toast('渲染题目异常，请刷新重试');
  }
}

function pick(choice){
  if(picking) return;
  picking = true;
  answers[cur]=choice;
  // ✅无论是否最后一题，选中立刻保存，修复最后一题不持久化BUG
  save('cpt_progress',{cur,answers});
  renderQ();
  setTimeout(()=>{
    picking = false;
    if(cur<QUESTIONS.length-1){
      cur++;
      save('cpt_progress',{cur,answers});
      renderQ();
    }else {
      finish();
    }
  },280);
}

$('optA').onclick=()=>pick('A');
$('optB').onclick=()=>pick('B');
$('optC').onclick=()=>pick('C');
$('optD').onclick=()=>pick('D');
$('btnPrev').onclick=()=>{
  if(cur>0){
    cur--;
    save('cpt_progress',{cur,answers});
    renderQ();
  }
};

// ========= 三档转换函数 P/M/N =========
function getTier(score){
  if(score > 6) return "P";
  else if(score < -6) return "N";
  else return "M";
}

function computeCode(localAnswers){
  const dimScore = [0,0,0,0];
  console.log("【DEBUG】完整答卷数组：", localAnswers);
  for(let i=0;i<QUESTIONS.length;i++){
    const q = QUESTIONS[i];
    const ans = localAnswers[i];
    let scoreAdd = 0;
    if(ans === "A") scoreAdd = q.sa;
    else if(ans === "B") scoreAdd = q.sb;
    else if(ans === "C") scoreAdd = q.sc;
    else if(ans === "D") scoreAdd = q.sd;
    console.log(`第${i+1}题 ans=${ans} scoreAdd=${scoreAdd}`);
    const dimIndex = q.d;
    if(dimIndex >=0 && dimIndex <=3){
      dimScore[dimIndex] += scoreAdd;
    }
  }
  console.log("【DEBUG】各维度分数：", dimScore);
  let code = "";
  for(let d=0;d<4;d++){
    code += getTier(dimScore[d]);
  }
  console.log("【DEBUG】4位编码：", code);
  return code;
}

function finish(){
  // ✅先拷贝答卷副本，执行计算，计算完再重置，杜绝数组被清空BUG
  const localAnswersCopy = [...answers];
  console.log("【FINAL 最终答卷】", localAnswersCopy);
  const code = computeCode(localAnswersCopy);
  resetTestState();
  location.hash='r='+code;
  showResult(code,false);
}

/* ============ 结果页 ============ */
function tierLabel(ch,i){
  const d=DIMS[i];
  if(ch==="P") return d.poles[0]+"系";
  else if(ch==="N") return d.poles[1]+"系";
  else return "均衡系";
}

function showResult(code,fromShare){
  let r = RESULTS[code];
  if(!r){
    r = RESULTS["_default"];
  }
  const banner=$('friendBanner');
  if(fromShare){
    banner.style.display='block';
    banner.innerHTML=`你的朋友是【${r.city}型 · ${r.title||""}】<br>测测你是哪座城？`;
  }else banner.style.display='none';
  $('rCard').innerHTML=`
    <div style="color:${r.col};font-size:12px;letter-spacing:2px">${r.cname||""}</div>
    <div class="rcity">${r.city}型</div>
    <div class="rtitle">${r.title||""}</div>
    <div class="chips">${[...code].map((ch,i)=>{
      return `<span class="chip">${tierLabel(ch,i)}</span>`;
    }).join('')}</div>
    <div class="rquote">${r.q}</div>
    <div class="rsec">人格解析</div><div class="rtext">${r.x}</div>
    <div class="cols">
      <div class="col"><div class="t">你的高光</div><div class="v">${r.hi||""}</div></div>
      <div class="col"><div class="t">你的盲区</div><div class="v">${r.bug||""}</div></div>
    </div>
    <div class="rsec">城市关系</div><div class="rtext">${r.match||""}</div>
    <div class="rsec">生存指南</div>
    <ul class="guide">${(r.guide||[]).map(g=>`<li>${g}</li>`).join('')}</ul>
    <div class="gold">${r.gold||""}</div>`;
  show('s-result');
  $('btnPoster').onclick=()=>openPoster(code);
  $('btnCopy').onclick=()=>copyLink(code);
  $('btnAgain').onclick=()=>{
    resetTestState();
    location.hash='';
    show('s-gate');
    $('pwd').value='';
    $('pwdErr').textContent='';
    $('pwdHint').innerHTML=`每个密码可测试 ${MAX_USES} 次<br><small>⚠️本页面需要网页服务器部署，本地直接打开会网络报错</small>`;
    $('btnGate').disabled=false;
  };
}

function copyLink(code){
  const url=location.origin+location.pathname+'#r='+code;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast('结果链接已复制，快去分享吧'));
  }else{
    const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('复制成功')}catch(e){toast('复制失败，请手动复制地址栏链接')}
    document.body.removeChild(ta);
  }
}

/* ============ 【修复海报绘制BUG】 优化换行、徽章文字垂直居中、布局边界 ============ */
function openPoster(code){
  $('posterModal').classList.add('on');
  drawPoster(code);
}
$('btnClosePoster').onclick=()=>{
  $('posterModal').classList.remove('on');
};
$('btnSavePoster').onclick=async ()=>{
  const canvas = $('posterCanvas');
  try{
    const blob = await new Promise(resolve=>canvas.toBlob(b=>resolve(b),'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '城市人格结果.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast("海报已开始下载");
  }catch(e){
    toast("保存失败，请截图");
    console.error(e);
  }
};

function wrapLinesFixed(ctx,text,maxW){
  const lines=[];
  let line='';
  for(const ch of text){
    if(ch==='\n'){
      lines.push(line);
      line='';
      continue;
    }
    const test = line + ch;
    if(ctx.measureText(test).width > maxW){
      if(line) lines.push(line);
      line = ch;
    }else{
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}

function drawPoster(code){
  let r = RESULTS[code];
  if(!r) r = RESULTS["_default"];
  const cv=$('posterCanvas'),ctx=cv.getContext('2d');
  const W=1242,H=1656,M=96;
  ctx.fillStyle='#F7F4EE';
  ctx.fillRect(0,0,W,H);
  const INK='#2B2B2B',GRAY='#9a917f';
  const SERIF='"Songti SC","STSong",SimSun,serif';
  const SANS='"PingFang SC","Microsoft YaHei",sans-serif';

  ctx.fillStyle=GRAY;
  ctx.font=`26px ${SANS}`;
  ctx.textAlign='left';
  ctx.fillText('你的性格最像哪座城？',M,120);

  ctx.textAlign='right';
  ctx.font=`24px monospace`;
  ctx.fillText('编码 '+code,W-M,120);

  ctx.textAlign='left';
  ctx.fillStyle=r.col;
  ctx.font=`bold 150px ${SERIF}`;
  ctx.fillText(r.city+'型',M,330);

  ctx.fillStyle=INK;
  ctx.font=`500 44px ${SANS}`;
  ctx.fillText(r.title||"",M,404);

  // 圆形徽章，文字垂直居中修复
  const cx = W-M-90;
  const cy = 300;
  ctx.strokeStyle=r.col;
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,86,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,64,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=r.col;
  ctx.font=`bold 60px ${SERIF}`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(r.city[0], cx, cy);
  ctx.textBaseline='alphabetic';

  ctx.textAlign='left';
  let y=440;
  ctx.font=`32px ${SANS}`;
  const chipLab = [...code].map((ch,i)=>tierLabel(ch,i));
  chipLab.forEach(lab=>{
    ctx.fillStyle=r.col;
    ctx.fillText(lab,M,y);
    y +=48;
  });
  y +=30;

  ctx.font=`36px ${SERIF}`;
  const quoteLines = wrapLinesFixed(ctx,r.q,W-M*2);
  quoteLines.forEach(line=>{
    ctx.fillText(line,M,y);
    y +=48;
  });
}

// hash分享解析，打开#r=xxx直接渲染结果
function parseHash(){
  const h = location.hash.replace("#r=","");
  if(h && h.length===4){
    showResult(h,true);
  }
}
parseHash();
window.addEventListener("hashchange",parseHash);

});
