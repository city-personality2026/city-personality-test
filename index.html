<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>人格维度测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif}
body{background:#f4f6f9;color:#222;padding:24px;max-width:720px;margin:0 auto}
.box{background:#fff;border-radius:16px;padding:28px;box-shadow:0 4px 18px rgba(0,0,0,0.08)}
h1{font-size:24px;margin-bottom:12px;text-align:center}
.desc{color:#666;text-align:center;margin-bottom:24px;line-height:1.6}
.pwd-wrap{display:flex;gap:10px;margin-bottom:20px}
#pwd{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:16px}
#startBtn{padding:12px 20px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer}
#startBtn:hover{background:#1d4ed8}
.progress{height:8px;background:#e5e7eb;border-radius:99px;margin:16px 0;overflow:hidden}
#barFill{height:100%;width:0%;background:#2563eb;transition:0.25s}
#dimName{color:#2563eb;font-weight:600;margin-bottom:8px}
#qNum{color:#888;font-size:14px;margin-bottom:12px}
#qText{font-size:18px;line-height:1.7;margin-bottom:24px}
.opt{border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:0.15s}
.opt:hover{border-color:#2563eb;background:#f8faff}
.opt.sel{border-color:#2563eb;background:#2563eb;color:#fff}
.btns{display:flex;justify-content:space-between;margin-top:24px}
.btns button{padding:11px 18px;border-radius:10px;border:none;font-size:15px;cursor:pointer}
#btnPrev{background:#eee;color:#333}
#btnNext{background:#2563eb;color:#fff}
#resultBox{display:none}
.dim-item{margin:16px 0}
.dim-row{display:flex;justify-content:space-between;margin-bottom:4px}
.dim-bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.dim-val{height:100%;background:#2563eb}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:999}
</style>
</head>
<body>
<div class="box">
  <h1>人格维度测试</h1>
  <p class="desc">根据你的真实想法选择，答案没有好坏之分</p>

  <div id="loginBox">
    <div class="pwd-wrap">
      <input id="pwd" placeholder="输入访问密码" type="password">
      <button id="startBtn">开始测试</button>
    </div>
  </div>

  <div id="quizBox" style="display:none">
    <div id="dimName"></div>
    <div id="qNum"></div>
    <div class="progress">
      <div id="barFill"></div>
    </div>
    <div id="qText"></div>
    <div class="opt" id="optA"></div>
    <div class="opt" id="optB"></div>
    <div class="opt" id="optC"></div>
    <div class="opt" id="optD"></div>
    <div class="btns">
      <button id="btnPrev">上一题</button>
      <button id="btnNext">下一题</button>
    </div>
  </div>

  <div id="resultBox">
    <h2>你的测试结果</h2>
    <div id="resultInner"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ========== 配置区 ==========
const PASSWORD = "123456"; // 改成你自己的密码
const DIMS = [
  {name:"维度A",max:24},
  {name:"维度B",max:24},
  {name:"维度C",max:24},
  {name:"维度D",max:24},
];

const QUESTIONS = [
  {d:0,q:"我喜欢主动认识新朋友",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:0,q:"聚会时我常常是话题带动者",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:0,q:"空闲时我更愿意外出而不是独处",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:0,q:"遇到问题我习惯先和别人商量",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},

  {d:1,q:"我习惯提前做好计划再行动",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:1,q:"我讨厌临时变动安排",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:1,q:"做事我追求条理、井井有条",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:1,q:"我会尽量按时完成任务",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},

  {d:2,q:"我很在意别人的感受",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:2,q:"看到别人难过我容易共情",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:2,q:"做决定时我会顾及人情",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:2,q:"我尽量避免和他人发生冲突",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},

  {d:3,q:"面对压力我容易焦虑紧张",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:3,q:"我经常反复担心事情结果",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:3,q:"受到批评之后会低落很久",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
  {d:3,q:"陌生环境会让我不安",a:"非常符合",b:"比较符合",c:"不太符合",d:"完全不符合"},
];
// 分值映射 A=3 B=2 C=1 D=0
const SCORE_MAP = {A:3,B:2,C:1,D:0};
// ===========================

const $ = id => document.getElementById(id);
const toast = txt => {
  const t = $("toast");
  t.textContent = txt;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1800);
};

let cur = 0;
let answers = Array(QUESTIONS.length).fill(null);

// 渲染题目【修复版本，增加容错，解决 undefined.name 报错】
function renderQ(){
  console.log('renderQ运行，当前题号：', cur);
  try{
    const q = QUESTIONS[cur];
    console.log('当前题目对象', q);

    // 核心修复：如果维度下标不存在，兜底 DIMS[0]，不会崩溃
    const dim = DIMS[q.d] ?? DIMS[0];

    $("dimName").textContent = dim.name;
    $("qNum").textContent = `${cur+1} / ${QUESTIONS.length}`;
    $("barFill").style.width = (cur / QUESTIONS.length * 100) + "%";
    $("qText").textContent = q.q;

    $("optA").textContent = q.a;
    $("optB").textContent = q.b;
    $("optC").textContent = q.c;
    $("optD").textContent = q.d;

    $("optA").classList.toggle("sel", answers[cur]==="A");
    $("optB").classList.toggle("sel", answers[cur]==="B");
    $("optC").classList.toggle("sel", answers[cur]==="C");
    $("optD").classList.toggle("sel", answers[cur]==="D");

    $("btnPrev").style.visibility = cur === 0 ? "hidden" : "visible";
  }catch(e){
    console.error("renderQ异常：", e);
    toast("渲染题目异常，请刷新重试");
  }
}

// 选项点击
$("optA").onclick = ()=>{ answers[cur]="A"; renderQ(); };
$("optB").onclick = ()=>{ answers[cur]="B"; renderQ(); };
$("optC").onclick = ()=>{ answers[cur]="C"; renderQ(); };
$("optD").onclick = ()=>{ answers[cur]="D"; renderQ(); };

$("btnPrev").onclick = ()=>{
  if(cur>0){ cur--; renderQ(); }
};
$("btnNext").onclick = ()=>{
  if(answers[cur]==null){
    toast("请先选择一项答案");
    return;
  }
  if(cur < QUESTIONS.length - 1){
    cur++;
    renderQ();
  }else{
    calcResult();
  }
};

// 计算结果
function calcResult(){
  const scores = DIMS.map(()=>0);
  for(let i=0;i<QUESTIONS.length;i++){
    const q = QUESTIONS[i];
    const ans = answers[i];
    const s = SCORE_MAP[ans];
    const dimIdx = q.d;
    if(scores[dimIdx] !== undefined){
      scores[dimIdx] += s;
    }
  }
  // 渲染结果
  let html = "";
  for(let i=0;i<DIMS.length;i++){
    const d = DIMS[i];
    const val = scores[i];
    const pct = val / d.max * 100;
    html += `
    <div class="dim-item">
      <div class="dim-row">
        <span>${d.name}</span>
        <span>${val} / ${d.max}</span>
      </div>
      <div class="dim-bar">
        <div class="dim-val" style="width:${pct}%"></div>
      </div>
    </div>
    `;
  }
  $("resultInner").innerHTML = html;
  $("quizBox").style.display = "none";
  $("resultBox").style.display = "block";
}

// 密码登录
$("startBtn").onclick = ()=>{
  const inputPwd = $("pwd").value.trim();
  if(inputPwd === PASSWORD){
    $("loginBox").style.display="none";
    $("quizBox").style.display="block";
    renderQ();
  }else{
    toast("密码错误");
  }
};
$("pwd").onkeydown = e=>{
  if(e.key === "Enter") $("startBtn").click();
};
</script>
</body>
</html>
