/* ============ 工具函数 ============ */
const $ = id => document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);}
let toastTimer=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function load(key,def){try{return JSON.parse(localStorage.getItem(key))??def}catch(e){return def}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}

/* ============ 密码校验：直接调用Supabase REST API ============ */
let currentPwd=null;
let isRequesting=false;

async function apiStart(pwd){
  try{
    const q = encodeURIComponent(pwd);
    const selUrl = `${SUPABASE_URL}/rest/v1/test_passwords?pwd=eq.${q}&select=pwd,max_uses,used`;
    const selRes = await fetch(selUrl,{
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    const rows = await selRes.json();
    if(!Array.isArray(rows) || rows.length===0){
      return {ok:false,error:"invalid"};
    }
    const row = rows[0];
    if(row.used >= row.max_uses){
      return {ok:false,error:"exhausted"};
    }
    const newUsed = row.used + 1;
    const patchUrl = `${SUPABASE_URL}/rest/v1/test_passwords?pwd=eq.${q}`;
    await fetch(patchUrl,{
      method:"PATCH",
      headers:{
        "apikey": SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({used:newUsed})
    });
    const left = row.max_uses - newUsed;
    return {ok:true, left};
  }catch(e){
    console.error(e);
    return {ok:false,error:"network"};
  }
}

$('btnGate').onclick=async ()=>{
  if(isRequesting) return;
  const pwd=$('pwd').value.trim();
  if(!pwd){$('pwdErr').textContent='请输入测试密码';return}
  isRequesting=true;
  $('btnGate').disabled=true;
  $('btnGate').textContent='验证中…';
  $('pwdErr').textContent='';
  const ret=await apiStart(pwd);
  isRequesting=false;
  $('btnGate').disabled=false;
  $('btnGate').textContent='开始测试';
  if(!ret.ok){
    if(ret.error==='invalid'){
      $('pwdErr').textContent='密码不正确，请重试';
    }else if(ret.error==='exhausted'){
      $('pwdErr').textContent='该密码的测试机会已用完';
      $('btnGate').disabled=true;
    }else{
      $('pwdErr').textContent='网络异常，请稍后重试';
    }
    return;
  }
  currentPwd=pwd;
  $('pwdHint').textContent=`验证通过，本密码剩余 ${ret.left} 次测试机会`;

  // 修复：直接丢弃旧版本本地缓存，强制全新开始，不再confirm弹窗
  localStorage.removeItem('cpt_progress');
  cur=0;
  answers=Array(QUESTIONS.length).fill(null);
  save('cpt_progress',{cur,answers});
  renderQ();
  show('s-quiz');
};

$('pwd').addEventListener('input',()=>{
  $('pwdErr').textContent='';
  $('btnGate').disabled=false;
  $('pwdHint').textContent='每个密码可测试 3 次';
});
$('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnGate').click()});

/* ============ 四选项答题逻辑 ============ */
let cur=0, answers=Array(QUESTIONS.length).fill(null);

function renderQ(){
  const q=QUESTIONS[cur];
  $('qNum').textContent=`${cur+1} / ${QUESTIONS.length}`;
  $('dimName').textContent=DIMS[q.d].name;
  $('barFill').style.width=(cur/QUESTIONS.length*100)+'%';
  $('qText').textContent=q.q;

  $('optA').textContent=q.a;
  $('optB').textContent=q.b;
  $('optC').textContent=q.c;
  $('optD').textContent=q.d;

  $('optA').classList.toggle('sel',answers[cur]==='A');
  $('optB').classList.toggle('sel',answers[cur]==='B');
  $('optC').classList.toggle('sel',answers[cur]==='C');
  $('optD').classList.toggle('sel',answers[cur]==='D');

  $('btnPrev').style.visibility=cur===0?'hidden':'visible';
}

function pick(choice){
  answers[cur]=choice;
  save('cpt_progress',{cur,answers});
  renderQ();
  setTimeout(()=>{
    if(cur<QUESTIONS.length-1){
      cur++;
      save('cpt_progress',{cur,answers});
      renderQ();
    }else finish();
  },280);
}

$('optA').onclick=()=>pick('A');
$('optB').onclick=()=>pick('B');
$('optC').onclick=()=>pick('C');
$('optD').onclick=()=>pick('D');

$('btnPrev').onclick=()=>{
  if(cur>0){
    cur--;
    save('cpt_progress',{cur,answers});
    renderQ();
  }
};

// 四选项计分，输出4位01编码，兼容原有16城市结果
function computeCode(){
  const dimScore=[0,0,0,0];
  for(let i=0;i<QUESTIONS.length;i++){
    const q=QUESTIONS[i];
    const ch=answers[i];
    let s=0;
    if(ch==='A') s=q.sa;
    else if(ch==='B') s=q.sb;
    else if(ch==='C') s=q.sc;
    else if(ch==='D') s=q.sd;
    dimScore[q.d] += s;
  }
  let code='';
  for(let d=0;d<4;d++){
    code += dimScore[d] >= 0 ? '0':'1';
  }
  return code;
}

function finish(){
  const code=computeCode();
  save('cpt_progress',{cur:0,answers:Array(QUESTIONS.length).fill(null)});
  location.hash='r='+code;
  showResult(code,false);
}

    banner.innerHTML=`你的朋友是【${r.city}型 · ${r.title}】<br>测测你是哪座城？`;
  }else banner.style.display='none';

    <div style="color:${r.col};font-size:12px;letter-spacing:2px">${r.cname}</div>
    <div class="rcity">${r.city}型</div>
    <div class="rtitle">${r.title}</div>
    <div class="chips">${[...code].map((b,i)=>`<span class="chip">${DIMS[i].poles[+b]}系</span>`).join('')}</div>
    <div class="rquote">${r.q}</div>

    <div class="cols">

      <div class="col"><div class="t">你的盲区</div><div class="v">${r.bug}</div></div>
    </div>
    <div class="rsec">城市关系</div><div class="rtext">${r.match}</div>
    <div class="rsec">生存指南</div>
    <ul class="guide">${r.guide.map(g=>`<li>${g}</li>`).join('')}</ul>
    <div class="gold">${r.gold}</div>`;
  show('s-result');
  $('btnPoster').onclick=()=>openPoster(code);

    location.hash='';
    show('s-gate');
    $('pwd').value='';
    $('pwdErr').textContent='';
    $('pwdHint').textContent=`每个密码可测试 ${MAX_USES} 次`;
    $('btnGate').disabled=false;

}

function copyLink(code){
  const url=location.origin+location.pathname+'#r='+code;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast('结果链接已复制，快去分享吧'));
  }else{
    const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('结果链接已复制')}catch(e){toast('复制失败，请手动复制地址栏链接')}
    document.body.removeChild(ta);
  }
}

/* ============ 海报生成 ============ */
function wrapLines(ctx,text,maxW){
  const lines=[];let line='';
  for(const ch of text){
    if(ch==='\n'){lines.push(line);line='';continue}
    if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch;
  }
  if(line)lines.push(line);return lines;
}
function drawPoster(code){
  const r=RESULTS[code];
  const cv=$('posterCanvas'),ctx=cv.getContext('2d');
  const W=1242,H=1656,M=96;
  ctx.fillStyle='#F7F4EE';ctx.fillRect(0,0,W,H);
  const INK='#2B2B2B',GRAY='#8a8172';
  const SERIF='"Songti SC","STSong",SimSun,serif';
  const SANS='"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle=GRAY;ctx.font=`26px ${SANS}`;
  ctx.textAlign='left';ctx.fillText('你的性格最像哪座城？',M,120);
  ctx.textAlign='right';ctx.font=`24px monospace`;
  ctx.fillText('四维代码 '+codeName(code),W-M,120);
  ctx.textAlign='left';ctx.fillStyle=r.col;
  ctx.font=`700 150px ${SERIF}`;
  ctx.fillText(r.city+'型',M,330);
  ctx.fillStyle=INK;ctx.font=`500 44px ${SANS}`;
  ctx.fillText(r.title,M,404);
  ctx.strokeStyle=r.col;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(W-M-90,300,86,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W-M-90,300,64,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=r.col;ctx.font=`500 60px ${SERIF}`;
  ctx.textAlign='center';ctx.fillText(r.city[0],W-M-90,322);
  ctx.textAlign='left';
  const poles=[...code].map((b,i)=>DIMS[i].poles[+b]+'系');
  let cx=M;
  ctx.font=`26px ${SANS}`;
  poles.forEach(p=>{
    const w=ctx.measureText(p).width+40;
    ctx.strokeStyle=r.col;ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(cx,452,w,52,26);ctx.stroke();
    ctx.fillStyle=INK;ctx.fillText(p,cx+20,487);
    cx+=w+20;
  });
  let y=620;
  ctx.strokeStyle='#d9d2c0';ctx.setLineDash([10,8]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(M,y-50);ctx.lineTo(W-M,y-50);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=INK;ctx.font=`700 74px ${SANS}`;
  const qLines=wrapLines(ctx,r.q,W-2*M);
  qLines.forEach(l=>{ctx.fillText(l,M,y);y+=100});
  y+=6;
  ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke();
  ctx.setLineDash([]);
  y+=64;
  ctx.fillStyle=GRAY;ctx.font=`26px ${SANS}`;
  ctx.fillText('人格解析',M,y);y+=48;
  ctx.fillStyle='#4a453c';ctx.font=`34px ${SANS}`;
  wrapLines(ctx,r.x,W-2*M).forEach(l=>{ctx.fillText(l,M,y);y+=52});
  y+=34;
  const colW=(W-2*M-24)/2,boxH=170;
  [[ '你的高光', r.hi ],[ '你的盲区', r.bug ]].forEach(([t,v],i)=>{
    const bx=M+i*(colW+24);
    ctx.strokeStyle='#e8e2d4';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx,y,colW,boxH,14);ctx.stroke();
    ctx.fillStyle=GRAY;ctx.font=`24px ${SANS}`;
    ctx.fillText(t,bx+26,y+48);
    ctx.fillStyle=INK;ctx.font=`30px ${SANS}`;
    wrapLines(ctx,v,colW-52).slice(0,2).forEach((l,j)=>ctx.fillText(l,bx+26,y+96+j*42));
  });
  y+=boxH+56;
  ctx.fillStyle=GRAY;ctx.font=`26px ${SANS}`;
  ctx.fillText('城市关系',M,y);y+=46;
  ctx.fillStyle='#4a453c';ctx.font=`32px ${SANS}`;
  ctx.fillText(r.match,M,y);
  const fy=H-210;
  ctx.strokeStyle='#d9d2c0';ctx.beginPath();ctx.moveTo(M,fy-40);ctx.lineTo(W-M,fy-40);ctx.stroke();
  ctx.strokeStyle=INK;ctx.lineWidth=3;
  ctx.strokeRect(M,fy,150,150);
  ctx.fillStyle=GRAY;ctx.font=`20px monospace`;ctx.textAlign='center';
  ctx.fillText('QR',M+75,fy+86);
  ctx.textAlign='left';ctx.fillStyle=INK;ctx.font=`32px ${SANS}`;
  ctx.fillText('测测你的城市人格',M+186,fy+64);
  ctx.fillStyle=GRAY;ctx.font=`24px ${SANS}`;
  ctx.fillText('16种人格，你是哪座城？',M+186,fy+106);
  ctx.font=`18px ${SANS}`;ctx.fillStyle='#b3ab98';
  ctx.fillText('本测试为娱乐向轻测评，结果不构成心理学诊断或职业建议',M,H-28);
}
function openPoster(code){
  drawPoster(code);
  $('posterModal').classList.add('on');
}

$('btnSavePoster').onclick=()=>{
  const cv=$('posterCanvas');
  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='城市人格-'+RESULTS[location.hash.replace('#r=','')].city+'型.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    toast('海报已保存：手机端长按图片存入相册，电脑端已下载');
  },'image/png');
};
