const answers = Array(QUESTIONS.length).fill(null);
const wrap = document.getElementById("wrap");
const resetBtn = document.getElementById("reset");

QUESTIONS.forEach((q, idx)=>{
  const box = document.createElement("div");
  box.className = "question";
  box.innerHTML = `<div class="q-title">${idx+1}. ${q.q}</div>
    <label class="opt" data-idx="${idx}" data-ans="A">A. ${q.a}</label>
    <label class="opt" data-idx="${idx}" data-ans="B">B. ${q.b}</label>
    <label class="opt" data-idx="${idx}" data-ans="C">C. ${q.c}</label>
    <label class="opt" data-idx="${idx}" data-ans="D">D. ${q.d}</label>`;
  wrap.appendChild(box);
});

document.querySelectorAll(".opt").forEach(el=>{
  el.onclick = ()=>{
    const i = el.dataset.idx;
    const ans = el.dataset.ans;
    answers[i] = ans;
    el.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
    el.classList.add("selected");
  }
})

// 单维度分数转标记
function getMark(score){
  if(score > 7) return "+";
  else if(score < -7) return "-";
  else if(score >= 0) return "=";
  else return "~";
}

function computeCode(){
  const dimScore = [0,0,0,0];
  for(let i=0;i<QUESTIONS.length;i++){
    const q = QUESTIONS[i];
    const ans = answers[i];
    let scoreAdd = 0;
    if(ans === "A") scoreAdd = q.sa;
    else if(ans === "B") scoreAdd = q.sb;
    else if(ans === "C") scoreAdd = q.sc;
    else if(ans === "D") scoreAdd = q.sd;
    const dimIndex = q.d;
    if(dimIndex >=0 && dimIndex <=3){
      dimScore[dimIndex] += scoreAdd;
    }
  }
  console.log("各维度分数：", dimScore);
  let markStr = "";
  for(let d=0;d<4;d++){
    markStr += getMark(dimScore[d]);
  }
  console.log("标记串：", markStr);
  return markStr;
}

document.getElementById("submit").onclick = ()=>{
  if(answers.includes(null)){
    alert("请完成所有题目！");
    return;
  }
  const code = computeCode();
  const cityItem = CITY_MAP[code];
  if(!cityItem){
    alert("暂无匹配城市");
    return;
  }
  document.getElementById("result").style.display = "block";
  resetBtn.style.display = "block";
  document.getElementById("cityName").innerText = cityItem.name;
  document.getElementById("cityDesc").innerText = cityItem.desc;
}

resetBtn.onclick = ()=>{
  answers.fill(null);
  document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
  document.getElementById("result").style.display = "none";
  resetBtn.style.display = "none";
}
</script>
</body>
</html>
